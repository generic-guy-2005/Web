<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-info">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Portal Belajar</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="/index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/mahasiswa/mahasiswa.html">Mahasiswa</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/dosen/dosen.html">Dosen</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <!-- Form -->
      <h1 class="p-5">Form Mahasiswa</h1>
      <form class="p-5">
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Nama</label>
          <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
          <div id="emailHelp" class="form-text">Your Name</div>
        </div>
        <div class="mb-3">
          <label for="exampleInputPassword1" class="form-label">NOBP</label>
          <input type="password" class="form-control" id="exampleInputPassword1">
          <div id="emailHelp" class="form-text">Your NIM</div>
        </div>
        <div class="mb-3">
          <label for="dateInput" class="form-label">Date of Birth</label>
          <input type="date" class="form-control" id="dateInput">
          <div id="emailHelp" class="form-text">Your DoB</div>
        </div>
        <div class="mb-3">
            <label for="genInput" class="form-label">Gender</label>
            
            <div>
                <input type="radio" id="male" name="drone" value="male" checked />
                <label for="male">Male</label>
              </div>
            
              <div>
                <input type="radio" id="female" name="drone" value="female" />
                <label for="female">Female</label>
              </div>
        </div>
        <div class="mb-3">
            <label for="hobbyCheck" class="form-label">Hobby</label>

              <div>
                <input type="checkbox" id="olga" name="olga" checked />
                <label for="olga">Sports</label>
              </div>
            
              <div>
                <input type="checkbox" id="read" name="read" />
                <label for="read">Reading</label>
              </div>

              <div>
                <input type="checkbox" id="travel" name="travel" />
                <label for="travel">Travelling</label>
              </div>

              <label for="address" class="mt-2">Address</label> <br>

              <textarea id="address" name="address" rows="5%" cols="140vw"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
        <button type="reset" class="btn btn-warning">Reset</button>
      </form>

      <!-- Footer -->
      <footer class="bg-dark text-white text-center py-3">
        <p> &copy; 2025 Rahmat Jevi. 2401082017 </p>
      </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  </body>
</html>
